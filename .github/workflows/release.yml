name: Manual PyPI Release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 'Check for [create-release!] in commit message'
        id: check_release
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "Last commit message: $MSG"
          if [[ "$MSG" == *"[create-release!]"* ]] || [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_release=true" >> $GITHUB_OUTPUT
          else
            echo "No [release] found and not manual trigger – skipping."
            echo "trigger_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        if: steps.check_release.outputs.trigger_release == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Linux only)
        if: steps.check_release.outputs.trigger_release == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libldap2-dev libsasl2-dev libssl-dev build-essential

      - name: Install dependencies
        if: steps.check_release.outputs.trigger_release == 'true'
        run: |
          python -m pip install python-semantic-release build

      - name: Publish GitHub release artifacts
        if: steps.check_release.outputs.trigger_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: semantic-release publish

      - name: Build distribution
        if: steps.check_release.outputs.trigger_release == 'true'
        run: |
          rm -rf dist dist-pypi
          python -m build

      - name: Prepare PyPI artifacts
        if: steps.check_release.outputs.trigger_release == 'true'
        run: |
          mkdir -p dist-pypi
          cp dist/*.tar.gz dist-pypi/

          echo "Artifacts selected for PyPI:"
          ls -lah dist-pypi/

          # Fail if a wheel accidentally ends up in the upload directory.
          if find dist-pypi -name '*.whl' | grep -q .; then
            echo "ERROR: Wheel found in PyPI upload directory"
            exit 1
          fi

      - name: Publish to PyPI
        if: steps.check_release.outputs.trigger_release == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-pypi/
