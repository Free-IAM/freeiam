[pytest]
pythonpath = src
addopts = --tb=native --capture=tee-sys -l -vvv --doctest-modules --show-capture=log --cov=freeiam
timeout = 30
markers =
    tls: mark test as requiring LDAP TLS readiness/wait
log_cli = false
log_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
log_cli_level = DEBUG
log_auto_indent = true
env =
  SASL_PATH={PWD}/tests/entrypoint:/usr/lib/x86_64-linux-gnu/sasl2
