[pytest]
pythonpath = src
addopts = --tb=native --capture=tee-sys -l -vvv --doctest-modules --show-capture=all --junitxml=pytest-results.xml --cov=freeiam --cov-report=term-missing
timeout = 30
markers =
    tls: mark test as requiring LDAP TLS readiness/wait
log_cli = false
log_level = DEBUG
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S
log_cli_level = DEBUG
log_auto_indent = true
junit_family = xunit2
junit_logging = all
junit_log_passing_tests = true
env =
  SASL_PATH={PWD}/tests/entrypoint:/usr/lib/x86_64-linux-gnu/sasl2
